<!doctype html>
<html lang="{{ site.lang }}">
<head>
  {% include head.html %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        {{ site.title }}
      </a>
      <nav>
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="on" aria-current="page"{% endif %}>던전</a>
        <a href="{{ '/tips/' | relative_url }}"{% if page.url == '/tips/' %} class="on" aria-current="page"{% endif %}>팁</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="on" aria-current="page"{% endif %}>소개</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/cursor.js' | relative_url }}"></script>
</body>
</html>
